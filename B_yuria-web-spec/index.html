<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf3f4" />
    <title>尤里亞的占卜計算器</title>
    <!-- Apply the stored page palette before first paint (key shared with src/main.ts). -->
    <script>try { var t = localStorage.getItem("yuria-web-theme-v1"); if (t === "amber" || t === "night") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
